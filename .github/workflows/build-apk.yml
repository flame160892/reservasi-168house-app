name: Build APK RESERVASI WEON

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Buat proyek Android
        run: npx cap add android

      - name: Generate ikon & splash dari folder resources/
        run: npx capacitor-assets generate --android --iconBackgroundColor '#121212' --splashBackgroundColor '#121212' || echo "lewati ikon"

      - name: Sinkronkan web ke Android
        run: npx cap sync android

      - name: Build APK RESERVASI WEON
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "weon-reservasi.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: reservasi-apk
          path: weon-reservasi.apk

      - name: Terbitkan di halaman Releases (link download tetap)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest weon-reservasi.apk --title "APK WEON terbaru" --notes "Build otomatis dari commit ${{ github.sha }}"
